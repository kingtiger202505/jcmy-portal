name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ECS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            SITE_DIR=/www/wwwroot/phjcmy.com
            REPO=https://github.com/kingtiger202505/jcmy-portal
            TMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TMP_DIR"' EXIT

            curl -fsSL "$REPO/archive/refs/heads/main.tar.gz" -o "$TMP_DIR/site.tar.gz"
            tar -xzf "$TMP_DIR/site.tar.gz" -C "$TMP_DIR"

            mkdir -p "$SITE_DIR"
            find "$SITE_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$TMP_DIR"/jcmy-portal-main/. "$SITE_DIR"/

            find "$SITE_DIR" -type d -exec chmod 755 {} \;
            find "$SITE_DIR" -type f -exec chmod 644 {} \;
            if id www >/dev/null 2>&1; then
              chown -R www:www "$SITE_DIR"
            fi
            echo "Deployed to $SITE_DIR at $(date '+%F %T')"
